# Gabarits des questions et des synthèses de référence (SPEC.md §12, §10 bis).
# Un jeu par réservoir : `entrainement` (entraînement et validation) et `test` ; aucun texte commun.
#
# Questions. {E} : description d'un événement ; {X} : personne ou société citée ;
# {D} : date (seule dans « par_date ») ; {E1} {E2} : deux événements ; {EL} : liste d'événements ;
# {il} {lui} : pronoms accordés au genre de la personne de la question précédente.
#
# Synthèses. Mots en minuscules, sans chiffre, sans nombre en lettres (ni « un », ni « une »),
# sans mois, sans négation, sans sigle : le contrôle le refuse (règles du masque, §10 bis).
# Champs : {P} participants nommés dans la source, {a} « a » ou « ont », {M} montants,
# {S} société, {D} date, {H} heure, {L} lieu avec « à » ou « au », {X} {Y} noms,
# {V0} {V1} valeurs contradictoires, {C} calcul. Un groupe [ … ] est gardé seulement si
# tous ses champs existent dans la source.

entrainement:
  evenements:
    AUDITION: ["l'audition de {X}", "la déposition de {X}"]
    VOL: ["le vol commis par {X}", "le vol reproché à {X}"]
    VIREMENT: ["le virement fait par {X}", "le virement ordonné par {X}"]
    APPEL: ["l'appel téléphonique de {X}", "la conversation téléphonique de {X}"]
    RENCONTRE: ["la rencontre avec {X}", "la réunion à laquelle {X} a participé"]
    SIGNATURE: ["le contrat signé par {X}", "la signature du contrat par {X}"]
    CONTROLE: ["le contrôle mené avec {X}", "le contrôle auquel {X} a pris part"]
    INTERPELLATION: ["l'interpellation de {X}", "l'arrestation de {X}"]
    CONSTATATION: ["le constat fait par {X}", "la constatation faite par {X}"]
  evenements_societe:
    VIREMENT: ["le virement reçu par {X}", "le virement au profit de {X}"]
    SIGNATURE: ["le contrat conclu avec {X}", "le contrat passé avec {X}"]
    CONTROLE: ["le contrôle de {X}", "le contrôle subi par {X}"]
  par_date:
    AUDITION: ["l'audition du {D}"]
    VOL: ["le vol du {D}"]
    VIREMENT: ["le virement du {D}"]
    APPEL: ["l'appel téléphonique du {D}"]
    RENCONTRE: ["la rencontre du {D}"]
    SIGNATURE: ["la signature de contrat du {D}"]
    CONTROLE: ["le contrôle du {D}"]
    INTERPELLATION: ["l'interpellation du {D}"]
    CONSTATATION: ["le constat du {D}"]
  qualif_date: [" du {D}", " le {D}"]
  relais:
    AUDITION: ["la personne entendue en même temps que {X}"]
    VOL: ["la personne qui a commis un vol avec {X}"]
    VIREMENT: ["la personne qui a fait un virement avec {X}"]
    APPEL: ["la personne qui a eu {X} au téléphone"]
    RENCONTRE: ["la personne qui a rencontré {X}"]
    SIGNATURE: ["la personne qui a signé un contrat avec {X}"]
    CONTROLE: ["la personne qui a participé à un contrôle avec {X}"]
    INTERPELLATION: ["la personne interpellée en même temps que {X}"]
    CONSTATATION: ["la personne qui a fait des constatations avec {X}"]
  attributs:
    DATE: ["Quand a eu lieu {E} ?", "À quelle date situer {E} ?", "De quand date {E} ?"]
    HEURE:
      - "À quelle heure a eu lieu {E} ?"
      - "Quelle est l'heure de {E} ?"
      - "À quel moment de la journée a eu lieu {E} ?"
    LIEU: ["Où a eu lieu {E} ?", "Quel est le lieu de {E} ?", "À quel endroit a eu lieu {E} ?"]
    MONTANT:
      - "Quel montant était en jeu dans {E} ?"
      - "Quelle somme concerne {E} ?"
      - "Quel est le montant de {E} ?"
    SOCIETE:
      - "Quelle société était concernée par {E} ?"
      - "Quelle entreprise est liée à {E} ?"
      - "Quelle est la société en cause dans {E} ?"
    PERSONNE:
      - "Qui d'autre était impliqué dans {E} ?"
      - "Quelles autres personnes ont pris part à {E} ?"
      - "Quels autres participants compte {E} ?"
  calculs:
    SOMME:
      - "Quel est le montant total de {E1} et de {E2} ?"
      - "Quelle somme atteignent ensemble {E1} et {E2} ?"
      - "Additionnés, combien font les montants de {E1} et de {E2} ?"
    SOMME_UNE: ["Quel est le total des montants de {E} ?", "Combien font au total les sommes de {E} ?"]
    ECART:
      - "Quel écart sépare le montant de {E1} et celui de {E2} ?"
      - "Quelle est la différence entre le montant de {E1} et celui de {E2} ?"
    DUREE: ["Combien de jours séparent {E1} et {E2} ?", "Quel délai s'est écoulé entre {E1} et {E2} ?"]
    MIN:
      - "Quel est le plus petit montant parmi {EL} ?"
      - "Quelle est la somme la plus faible parmi {EL} ?"
    MAX:
      - "Quel est le montant le plus élevé parmi {EL} ?"
      - "Quelle est la plus grosse somme parmi {EL} ?"
  suites:
    DATE: ["Et quand cela s'est-il passé ?", "Et à quelle date ?"]
    HEURE: ["Et à quelle heure ?", "Et vers quelle heure cela s'est-il produit ?"]
    LIEU: ["Et où cela s'est-il passé ?", "Et où se trouvait-{il} alors ?"]
    MONTANT: ["Et pour quel montant ?", "Et quelle somme était en jeu ?"]
    SOCIETE: ["Et quelle société était concernée ?", "Et avec quelle entreprise ?"]
    PERSONNE: ["Et qui était avec {lui} ?", "Et avec qui était-{il} ?"]
  declarations:
    MEME: ["{X} et {Y} sont la même personne.", "Je précise que {X} et {Y} désignent la même personne."]
    DIFFERENT:
      - "{X} et {Y} sont deux personnes différentes."
      - "Attention, {X} et {Y} ne sont pas la même personne."
  synthese:
    AUDITION:
      - "les enquêteurs ont entendu {P}."
      - "l'audition concerne {P}."
      - "{P} {a} déposé devant les enquêteurs."
      - "d'après la pièce, {P} {a} fait l'objet de l'audition."
      - "les déclarations de {P} ont été recueillies."
    VOL:
      - "{P} {a} commis le vol[ de {M}]."
      - "le vol[ de {M}] est le fait de {P}."
      - "{P} {a} dérobé[ la somme de {M}]."
      - "d'après la pièce, {P} {a} pris part au vol[ portant sur {M}]."
      - "{P} {a} volé[ {M}]."
    VIREMENT:
      - "{P} {a} viré[ {M}][ à la société {S}]."
      - "le virement[ de {M}] émane de {P}[ au profit de la société {S}]."
      - "{P} {a} ordonné le virement[ de {M}][ vers la société {S}]."
      - "d'après la pièce, {P} {a} transféré[ {M}][ à la société {S}]."
      - "les fonds envoyés par {P}[ à la société {S}][ s'élèvent à {M}]."
    APPEL:
      - "{P} {a} passé l'appel téléphonique."
      - "l'appel téléphonique implique {P}."
      - "{P} {a} échangé par téléphone."
      - "d'après la pièce, {P} {a} eu cette conversation téléphonique."
      - "la communication téléphonique concerne {P}."
    RENCONTRE:
      - "{P} {a} participé à la rencontre."
      - "la rencontre réunit {P}."
      - "{P} {a} pris part à cette réunion."
      - "d'après la pièce, {P} {a} assisté au rendez-vous."
      - "l'entrevue s'est tenue en présence de {P}."
    SIGNATURE:
      - "{P} {a} signé le contrat[ de {M}][ avec la société {S}]."
      - "le contrat[ conclu avec la société {S}] engage {P}[ pour {M}]."
      - "{P} {a} conclu l'accord[ de {M}][ avec la société {S}]."
      - "d'après la pièce, {P} {a} paraphé le contrat[ avec la société {S}][ pour {M}]."
      - "la signature du contrat[ de {M}] implique {P}[ et la société {S}]."
    CONTROLE:
      - "{P} {a} participé au contrôle[ de la société {S}]."
      - "le contrôle[ de la société {S}] a été mené par {P}."
      - "{P} {a} vérifié les comptes[ de la société {S}]."
      - "d'après la pièce, {P} {a} pris part à l'inspection[ de la société {S}]."
      - "la vérification[ visant la société {S}] associe {P}."
    INTERPELLATION:
      - "l'interpellation concerne {P}."
      - "les policiers ont interpellé {P}."
      - "{P} {a} fait l'objet de l'interpellation."
      - "d'après la pièce, l'arrestation vise {P}."
      - "la police a arrêté {P}."
    CONSTATATION:
      - "{P} {a} constaté les dégradations."
      - "les constatations ont été faites par {P}."
      - "{P} {a} relevé des dommages."
      - "d'après la pièce, {P} {a} signalé des dégâts."
      - "le constat associe {P}."
    CIRCONSTANCES:
      - "les faits ont eu lieu le {D}[ vers {H}][ {L}]."
      - "cela s'est produit[ {L}] le {D}[ à {H}]."
      - "la date retenue est le {D}[, vers {H}][, {L}]."
      - "l'événement est daté du {D}[ et situé {L}][, à {H}]."
      - "le {D}[ à {H}], les faits se sont déroulés[ {L}]."
    ALIAS:
      - "{X} porte le surnom {Y}."
      - "le surnom de {X} est {Y}."
      - "{Y} désigne {X}."
      - "d'après cette pièce, {X} se fait appeler {Y}."
      - "{X} et {Y} désignent la même personne."
    RESSEMBLANCE:
      - "la pièce nomme cette personne {Y}."
      - "cette personne apparaît sous la forme {Y}."
      - "le nom écrit dans la pièce est {Y}."
      - "{Y} semble désigner la personne visée."
      - "la personne de la question correspond probablement à {Y}."
    CONFLIT:
      - "les témoins se contredisent : {V0} contre {V1}."
      - "les sources divergent, avec {V0} face à {V1}."
      - "les versions s'opposent : {V0} ou {V1}."
      - "il existe des versions contradictoires : {V0} et {V1}."
      - "les témoignages diffèrent entre {V0} et {V1}."
    SOMME:
      - "le total de ces montants atteint {C}."
      - "ensemble, ces sommes font {C}."
      - "l'addition des montants donne {C}."
      - "au total, cela représente {C}."
      - "la somme cumulée s'élève à {C}."
    ECART:
      - "l'écart entre ces montants est de {C}."
      - "la différence s'élève à {C}."
      - "ces sommes diffèrent de {C}."
      - "la soustraction des montants donne {C}."
      - "l'écart constaté atteint {C}."
    DUREE:
      - "ces faits sont séparés de {C}."
      - "le délai entre ces dates est de {C}."
      - "il s'écoule {C} entre ces faits."
      - "la durée entre ces événements atteint {C}."
      - "l'intervalle entre ces dates vaut {C}."
    MIN:
      - "le montant minimal est {C}."
      - "la somme la plus faible vaut {C}."
      - "le minimum de ces montants est {C}."
      - "parmi ces sommes, la plus basse atteint {C}."
      - "le montant le moins élevé est {C}."
    MAX:
      - "le plus gros montant est {C}."
      - "la somme la plus élevée vaut {C}."
      - "le maximum de ces montants est {C}."
      - "parmi ces sommes, la plus haute atteint {C}."
      - "le montant le plus important est {C}."
    DISTINCTS:
      - "{X} et {Y} apparaissent ensemble dans cette pièce."
      - "cette pièce cite {X} aux côtés de {Y}."
      - "{X} et {Y} y figurent comme des personnes distinctes."
      - "la pièce mentionne à la fois {X} et {Y}."
      - "{X} agit ici avec {Y}, ce qui les distingue."

