[project]
name = "ccm"
version = "0.0.0"
description = "CCM : modèle de citation amnésique"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bm25s>=0.2",
    "datasketch>=2.0.0",
    "pydantic>=2.9",
    "pypdfium2>=4.30",
    "pysbd>=0.3.4",
    "pystemmer>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
ccm = "ccm.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.3",
    "ruff>=0.8",
]
interne = [
    "pymupdf>=1.24,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
default-groups = ["dev", "interne"]
