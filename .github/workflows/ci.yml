name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - if: runner.os == 'Windows'
        run: choco install make -y
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra
      - uses: actions/cache@v4
        with:
          path: runs/modeles
          key: modeles-${{ runner.os }}-${{ hashFiles('ccm/data/modeles.py') }}
      - run: make setup
      - run: make test-complet
